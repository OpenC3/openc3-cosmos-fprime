name: F Prime End-to-End Tests

# Builds the fprime-test F Prime 4.4.1 Ref deployment, starts COSMOS Core with this plugin
# installed, and runs the plugin's test procedures through the COSMOS CLI.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shipped target's build: TlmPacketizer, TC/TM frames with packet spanning
          - name: frames-packetizer
            tlm_send: packetizer
            com: frames
            headers: SPACE_PACKET
          # Ref's default TlmChan, TC/TM frames with packet spanning
          - name: frames-chan
            tlm_send: chan
            com: frames
            headers: SPACE_PACKET
          # ComCcsds.SpacePacket: bare Space Packets, no transfer frames
          - name: spacepacket-chan
            tlm_send: chan
            com: spacepacket
            headers: SPACE_PACKET_ONLY
    name: e2e (${{ matrix.name }})
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build F Prime
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: fprime-test
        build-args: |
          TLM_SEND=${{ matrix.tlm_send }}
          COM=${{ matrix.com }}
        tags: openc3-fprime-test
        load: true
        cache-from: type=gha,scope=fprime-${{ matrix.name }}
        cache-to: type=gha,scope=fprime-${{ matrix.name }},mode=max

    - name: Start F Prime
      run: docker run -d --name fprime -p 50000:50000 openc3-fprime-test

    - name: Set up Ruby
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: "3.3"

    - name: Build plugin
      run: |
        rake build VERSION=0.0.0
        mkdir -p build && mv openc3-cosmos-fprime-0.0.0.gem build/

    - name: Run tlm_test.py
      run: fprime-test/e2e.sh build/openc3-cosmos-fprime-0.0.0.gem ${{ matrix.headers }} FPRIME/procedures/tlm_test.py TlmSuite

    - name: Collect logs
      if: always()
      run: |
        mkdir -p e2e-results
        docker logs fprime > e2e-results/fprime.log 2>&1 || true
        cd cosmos-project 2>/dev/null && for service in openc3-operator openc3-cosmos-cmd-tlm-api openc3-cosmos-script-runner-api openc3-cosmos-init; do
          docker compose logs $service > ../e2e-results/$service.log 2>&1 || true
        done

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-${{ matrix.name }}
        path: e2e-results
